# Skill component CI: only the read-only AI skill is built and checked.
name: skill-ci

on:
  push:
    branches: [main]
    paths:
      - "skill/**"
      - ".github/workflows/skill-ci.yml"
  pull_request:
    paths:
      - "skill/**"
      - ".github/workflows/skill-ci.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: skill/package-lock.json
      - name: Install dependencies
        run: npm --prefix skill ci
      - name: Typecheck
        run: npm --prefix skill run typecheck
      - name: Tests
        run: npm --prefix skill test
      - name: Build
        run: npm --prefix skill run build
