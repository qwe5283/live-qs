# Skill component release channel (ADR-0002). Tag `skill/vX.Y.Z` checks and
# publishes ONLY the read-only AI skill as an npm pack tarball.
name: skill-release

on:
  push:
    tags:
      - "skill/v*"

permissions:
  contents: write

concurrency:
  group: release-skill
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: skill/package-lock.json
      - name: Derive the release version from the tag
        run: |
          VERSION="${GITHUB_REF_NAME#skill/v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Tag must be skill/vX.Y.Z, got $GITHUB_REF_NAME"; exit 1; }
      - name: Verify the tag matches the package version
        run: test "$(node -p "require('./skill/package.json').version")" = "$VERSION"
      - name: Install dependencies and check
        run: |
          npm --prefix skill ci
          npm --prefix skill run typecheck
          npm --prefix skill test
          npm --prefix skill run build
      - name: Pack the tarball
        run: |
          mkdir -p dist
          npm --prefix skill pack --pack-destination dist
      - name: Create the versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "Skill ${VERSION}" \
            --notes "LiveQs read-only AI skill ${VERSION} (npm pack tarball of @live-qs/skill)." \
            dist/liveqs-skill-"${VERSION}".tgz
