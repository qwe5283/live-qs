# Web component release channel (ADR-0002). Tag `web/vX.Y.Z` builds and
# publishes ONLY the WebUI as a static dist tarball. No update manifest
# exists for it (the browser app is served, not side-loaded).
name: web-release

on:
  push:
    tags:
      - "web/v*"

permissions:
  contents: write

concurrency:
  group: release-web
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Derive the release version from the tag
        run: |
          VERSION="${GITHUB_REF_NAME#web/v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Tag must be web/vX.Y.Z, got $GITHUB_REF_NAME"; exit 1; }
      - name: Verify the tag matches the package version
        run: test "$(node -p "require('./web/package.json').version")" = "$VERSION"
      - name: Install dependencies and build
        run: |
          npm --prefix web ci
          npm --prefix web run build
      - name: Package the dist tarball
        run: |
          mkdir -p dist
          tar -czf "dist/liveqs-web-${VERSION}.tar.gz" -C web dist
      - name: Create the versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "Web ${VERSION}" \
            --notes "LiveQs WebUI ${VERSION} static build. Serve the dist directory behind the same origin as the server." \
            "dist/liveqs-web-${VERSION}.tar.gz"
