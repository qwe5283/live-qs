# Contracts component release channel (ADR-0002). Tag `contracts/vX.Y.Z`
# checks and publishes ONLY the contracts package as an npm pack tarball.
name: contracts-release

on:
  push:
    tags:
      - "contracts/v*"

permissions:
  contents: write

concurrency:
  group: release-contracts
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - name: Derive the release version from the tag
        run: |
          VERSION="${GITHUB_REF_NAME#contracts/v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Tag must be contracts/vX.Y.Z, got $GITHUB_REF_NAME"; exit 1; }
      - name: Verify the tag matches the package version
        run: test "$(node -p "require('./contracts/package.json').version")" = "$VERSION"
      - name: Install dependencies and check
        run: |
          npm --prefix contracts ci
          npm --prefix contracts run check
      - name: Pack the tarball
        run: |
          mkdir -p dist
          npm --prefix contracts pack --pack-destination dist
      - name: Create the versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "Contracts ${VERSION}" \
            --notes "LiveQs protocol contracts ${VERSION} (npm pack tarball of @live-qs/contracts)." \
            dist/liveqs-contracts-"${VERSION}".tgz
