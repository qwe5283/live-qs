openapi: 3.1.0
info:
  title: LiveQs V1 API
  version: 0.1.0
  description: >-
    Authoritative HTTP contract for the single-Owner LiveQs V1 service. Event
    bodies are governed by the versioned JSON Schemas under schemas/.
servers:
  - url: http://localhost:3000
    description: Local and trusted-LAN development
tags:
  - name: Owner
    description: Single-Owner authentication and revocable browser session lifecycle.
  - name: Credentials
    description: >-
      Owner-managed Device Tokens and Query Tokens. Each credential carries an
      actor type, scopes, permitted event types, a privacy ceiling, an optional
      expiry, and independently revocable state.
  - name: Events
    description: Versioned historical observations. Heartbeats are not events.
  - name: Heartbeats
    description: >-
      TTL-backed ephemeral current-state projections. A heartbeat is the device
      claim of what it observes right now; it is never a historical Event,
      never generates one, and never contributes to usage-time aggregation.
      Devices show offline within sixty seconds after heartbeats stop.
  - name: Diagnostics
    description: >-
      Per-device synchronization diagnostics (SPEC implementation decision 28).
      Collectors push a compact sync-state snapshot — pending counts, last
      collection and upload instants, and recent errors as stable error codes
      with safe summaries — on their sync cadence. Snapshots carry counts,
      codes, and timestamps only: no tokens, no raw window titles, no
      notification text, and no other free-form device content. The Owner
      reads them to tell missing activity apart from an uncollected backlog or
      a broken sync.
  - name: Metrics
    description: >-
      Day and week usage metrics computed from historical intervals under one
      report timezone. Device minutes sum qualifying device intervals and may
      exceed elapsed time; active minutes union qualifying non-AFK intervals
      so overlapping time counts once.
  - name: Health
    description: >-
      Versioned health observations (steps, heart rate, sleep) ingested from
      Health Connect with their data origin. Sleep appears only as
      source-provided intervals; the system never infers sleep from device
      idle time and never renders missing coverage as zero.
  - name: Payment
    description: >-
      Versioned payment transaction facts extracted on-device from payment
      notifications. Only the extracted amount, direction, approved merchant
      label, category, and source metadata are uploaded; notification bodies,
      titles, and other free text never leave the device. Transactions
      suspected to be duplicates stay flagged pending confirmation instead of
      being merged on amount and time alone.
  - name: Classification
    description: >-
      Owner-managed semantic dictionary and versioned classification rules.
      The Owner defines cross-platform service and project subjects in the
      WebUI; devices download the active rule set, cache the last successful
      version, and execute the rules locally so raw window titles never leave
      the device. Uploaded classifications contain only the subject, the
      category, the rule identifier, the rule version, and a confidence.
      Every entity in this dictionary is Owner-approved; newly discovered
      project names stay on the device and are represented by opaque
      device-secret HMAC identifiers until the Owner approves an alias.
  - name: Reclassification
    description: >-
      Explicit historical reclassification (SPEC implementation decision 19).
      Saving rules affects only future observations; the Owner may start a
      reclassification task so devices re-evaluate the locally retained raw
      context of already uploaded activity and submit higher revisions through
      the batch endpoint. The server never reclassifies by itself: raw titles
      exist only on devices. Events whose raw context has aged out of device
      retention are reported as unrecoverable instead of being silently
      skipped, manual Owner corrections always win, and every task is audited
      with the Owner, the target rule version, the time range, and the actual
      impact counts.
paths:
  /api/v1/owner/status:
    get:
      operationId: getOwnerStatus
      summary: Report whether the Owner password is configured
      description: >-
        Public endpoint used by the WebUI to distinguish first-run setup from
        login. There is exactly one implicit Owner and no username.
      tags: [Owner]
      security: []
      responses:
        "200":
          description: Initialization state of the single implicit Owner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerStatus"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/owner/setup:
    post:
      operationId: setupOwnerPassword
      summary: Create the Owner password on an uninitialized instance
      description: >-
        Allowed only while no Owner credential exists. Establishes the first
        Owner session and sets the liveqs_session cookie on success.
      tags: [Owner]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OwnerPasswordRequest"
      responses:
        "204":
          description: >-
            Owner credential created and first session established. The
            response sets the HttpOnly, SameSite liveqs_session cookie.
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/owner/login:
    post:
      operationId: loginOwner
      summary: Log in with the Owner password
      description: >-
        Verifies the password and establishes a revocable server-managed
        session in the HttpOnly, SameSite liveqs_session cookie.
      tags: [Owner]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OwnerPasswordRequest"
      responses:
        "204":
          description: Session established; the response sets the liveqs_session cookie.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/owner/logout:
    post:
      operationId: logoutOwner
      summary: Revoke the current Owner session
      description: >-
        Revokes the presented session server-side and clears the
        liveqs_session cookie. The revoked session can no longer access
        protected endpoints.
      tags: [Owner]
      security:
        - OwnerSession: []
      responses:
        "204":
          description: Session revoked and cookie cleared.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/owner/session:
    get:
      operationId: getOwnerSession
      summary: Probe the current Owner session
      description: WebUI entry point for distinguishing an authenticated browser from a guest.
      tags: [Owner]
      security:
        - OwnerSession: []
      responses:
        "200":
          description: The presented session is valid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerSessionInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/owner/settings:
    get:
      operationId: getOwnerSettings
      summary: Show Owner report settings
      description: >-
        Owner-managed report preferences. The report timezone defines the
        default day and week boundaries for every report; it is independent of
        any browser timezone so the same report stays stable everywhere.
      tags: [Owner]
      security:
        - OwnerSession: []
      responses:
        "200":
          description: Current Owner report settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
    post:
      operationId: updateOwnerSettings
      summary: Update Owner report settings
      description: >-
        Replaces the report timezone with a valid IANA timezone. Future day and
        week boundaries resolve in the new timezone; stored events keep their
        UTC instants and capture timezone context.
      tags: [Owner]
      security:
        - OwnerSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OwnerSettingsUpdate"
      responses:
        "200":
          description: Updated Owner report settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerSettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/credentials:
    get:
      operationId: listCredentials
      summary: List Device Tokens and Query Tokens with lifecycle state
      description: >-
        Returns every credential of the single Owner with creation time,
        expiry, last use, and revocation state. Token material is never
        included; each credential is identified by its recognizable prefix.
      tags: [Credentials]
      security:
        - OwnerSession: []
      responses:
        "200":
          description: All credentials, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
    post:
      operationId: createCredential
      summary: Create a Device Token or Query Token
      description: >-
        Creates a scoped credential for a collector or read-only agent. The
        plaintext token is returned exactly once in this response; the server
        persists only a secure digest and a recognizable prefix.
      tags: [Credentials]
      security:
        - OwnerSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialCreateRequest"
      responses:
        "201":
          description: Credential created; token plaintext is shown only in this response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialCreated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/credentials/{credential_id}/revoke:
    post:
      operationId: revokeCredential
      summary: Revoke a credential immediately
      description: >-
        Marks the credential revoked so it is rejected from the next use
        onwards. Revoking an already revoked credential is idempotent.
      tags: [Credentials]
      security:
        - OwnerSession: []
      parameters:
        - $ref: "#/components/parameters/CredentialId"
      responses:
        "204":
          description: The credential is revoked and can no longer authenticate.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/heartbeats:
    post:
      operationId: recordHeartbeat
      summary: Report the device current state as an expiring heartbeat
      description: >-
        Replaces the device current-state projection with the reported state
        unless the reported capture time is older than the stored one, in which
        case the heartbeat is acknowledged without regressing the stored state.
        Device identity is server-bound to the authenticated Device Token; the
        heartbeat never creates or modifies historical events.
      tags: [Heartbeats]
      security:
        - DeviceToken: []
      x-required-scopes: [events:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HeartbeatRequest"
      responses:
        "204":
          description: >-
            The heartbeat was accepted and the projection now reflects the
            newest reported state, or the heartbeat was older than the stored
            state and was acknowledged without regressing it.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/status:
    get:
      operationId: listDeviceStatuses
      summary: Show every device latest current state and online-ness
      description: >-
        One entry per device that has ever reported a heartbeat, oldest to
        newest by capture time. Each device is reported independently; the
        response never infers a single global attention focus. A device is
        online while its latest heartbeat capture time is less than sixty
        seconds old. Projections expire automatically and are never part of
        historical events or usage metrics.
      tags: [Heartbeats]
      security:
        - OwnerSession: []
      responses:
        "200":
          description: The current-state projection of every reporting device.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceStatusList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/diagnostics/sync:
    post:
      operationId: reportSyncDiagnostics
      summary: Push this device's synchronization-state snapshot
      description: >-
        Replaces the device's stored sync-diagnostics snapshot with the
        reported one. Collectors push on their sync cadence; the snapshot is
        best-effort and never queued, so a snapshot's age together with the
        heartbeat online flag tells the Owner how stale the view is. The body
        carries counts, timestamps, and bounded safe summaries only — raw
        window titles, executable paths, notification text, and tokens have no
        field to hide in and are rejected with the rest of the unknown fields.
        Device identity is server-bound to the authenticated Device Token.
      tags: [Diagnostics]
      security:
        - DeviceToken: []
      x-required-scopes: [events:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncDiagnosticsReport"
      responses:
        "204":
          description: The snapshot was stored and is now visible to the Owner.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
    get:
      operationId: listSyncDiagnostics
      summary: Show every device latest sync-state snapshot
      description: >-
        One entry per device that has ever pushed a sync-diagnostics snapshot,
        oldest to newest by report time. Ages are computed at read time from
        the server receive instant, so a device that stops reporting grows
        stale instead of disappearing. Diagnostics never become historical
        events and never contribute to usage metrics.
      tags: [Diagnostics]
      security:
        - OwnerSession: []
      responses:
        "200":
          description: The latest sync diagnostics snapshot of every reporting device.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncDiagnosticList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/events/batch:
    post:
      operationId: batchUpsertEvents
      summary: Submit event revisions with per-item acknowledgements
      tags: [Events]
      security:
        - DeviceToken: []
      x-required-scopes: [events:write, health:write, payment:write]
      description: >-
        Requires one of the listed write scopes. Enforcement is per item:
        activity.interval items require events:write, health.* items require
        health:write, and payment.transaction items require payment:write, so
        a credential holding only one domain's scope still receives per-item
        `insufficient_scope` rejections for the other domains instead of a
        whole-batch failure.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventBatchRequest"
      responses:
        "200":
          description: Every submitted item has an independent acknowledgement.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventBatchResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/events:
    get:
      operationId: listEvents
      summary: List latest valid event revisions
      tags: [Events]
      security:
        - OwnerSession: []
        - QueryToken: []
      x-required-scopes: [events:read]
      description: >-
        Credential reads are domain-scoped: events:read grants the activity
        domain, health:read grants the health domain, and payment:read grants
        the payment domain, so a query token without a domain's read scope
        never sees that domain's observations here. Owner sessions read every
        registered domain.
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Timezone"
        - $ref: "#/components/parameters/EventType"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: A page of latest, non-invalidated event revisions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/health/events:
    get:
      operationId: listHealthEvents
      summary: List latest valid health event revisions
      description: >-
        Health-domain read of steps, heart rate, and sleep observations.
        Requires health:read for credentials; Owner sessions read without a
        scope. Every observation carries its Health Connect data origin, and
        the query context reports completeness so missing coverage is never
        rendered as zero. Sleep appears only as source-provided intervals.
      tags: [Health]
      security:
        - OwnerSession: []
        - QueryToken: []
      x-required-scopes: [health:read]
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Timezone"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: A page of latest, non-invalidated health event revisions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/payment/events:
    get:
      operationId: listPaymentEvents
      summary: List latest valid payment transaction revisions
      description: >-
        Payment-domain read of structured transaction facts (amount, currency,
        direction, approved merchant label, category, occurrence time,
        pending-confirmation flag). Requires payment:read for credentials;
        Owner sessions read without a scope. Payment facts are sensitive by
        default, so credentials additionally need an adequate privacy ceiling.
        Notification text never existed anywhere in this data domain.
      tags: [Payment]
      security:
        - OwnerSession: []
        - QueryToken: []
      x-required-scopes: [payment:read]
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Timezone"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: A page of latest, non-invalidated payment transaction revisions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/events/{event_id}/corrections:
    post:
      operationId: correctEvent
      summary: Submit an auditable Owner correction for one event
      description: >-
        Owner-session-only correction of contract-approved structured fields
        (governed per registered event type), with an optional reason and an
        optional invalidation flag for false observations. The correction keeps
        the event identity and allocates a revision in a reserved high space
        above every device revision, so any later device re-upload of the same
        event answers stale_revision and can never overwrite a human
        interpretation or resurrect an invalidated fact. The superseded
        revision is archived before replacement (facts are never destroyed),
        the response reports the affected report-day ranges, and an audit
        record captures actor, time, changed fields, and reason without any
        credential material. Default queries then return the latest valid
        revision marked with its correction provenance.
      tags: [Events]
      security:
        - OwnerSession: []
      parameters:
        - $ref: "#/components/parameters/EventId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventCorrectionRequest"
      responses:
        "200":
          description: The correction was applied; the corrected event and its impact are returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventCorrectionResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/metrics/usage/day:
    get:
      operationId: getUsageDayMetrics
      summary: Day usage metrics with device and active minutes
      description: >-
        Computes usage metrics for one local calendar day. Boundaries resolve
        in the request timezone, or the Owner report timezone when the request
        omits it. Device minutes sum qualifying device intervals over the day
        and may exceed elapsed time; active minutes union qualifying non-AFK
        intervals so overlapping time counts once. Aggregate only; interval
        content is never included.
      tags: [Metrics]
      security:
        - OwnerSession: []
        - QueryToken: []
      x-required-scopes: [events:read]
      parameters:
        - $ref: "#/components/parameters/Date"
        - $ref: "#/components/parameters/ReportTimezone"
      responses:
        "200":
          description: Usage metrics for the requested local day.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageDayReport"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/metrics/usage/week:
    get:
      operationId: getUsageWeekMetrics
      summary: Week usage metrics with device and active minutes
      description: >-
        Computes usage metrics for the Monday-start week containing the
        requested local day. Boundaries resolve in the request timezone, or the
        Owner report timezone when the request omits it. Device minutes sum
        qualifying device intervals over the week and may exceed elapsed time;
        active minutes union qualifying non-AFK intervals so overlapping time
        counts once. Aggregate only; interval content is never included.
      tags: [Metrics]
      security:
        - OwnerSession: []
        - QueryToken: []
      x-required-scopes: [events:read]
      parameters:
        - $ref: "#/components/parameters/Date"
        - $ref: "#/components/parameters/ReportTimezone"
      responses:
        "200":
          description: Usage metrics for the week containing the requested local day.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageWeekReport"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/source-policy:
    get:
      operationId: getSourcePolicy
      summary: Show the versioned source-priority policy
      description: >-
        Returns the explicit, versioned source policy that chooses normalized
        results from retained observations. Until the Owner changes it,
        version 1 applies with the documented default priorities (Android
        UsageStats authoritative for daily application totals; payment totals
        prefer stable source identifiers). Retained observations are never
        deleted or rewritten by this policy.
      tags: [Metrics]
      security:
        - OwnerSession: []
      responses:
        "200":
          description: Current source policy document.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourcePolicyDocument"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
    put:
      operationId: updateSourcePolicy
      summary: Replace the source policy entries and record the impact
      description: >-
        Replaces the priority entries, bumps the policy version, and appends an
        audit record stating which report-day ranges and how many normalized
        results the change affected. Derived results rebuild on read; raw
        observations are never modified.
      tags: [Metrics]
      security:
        - OwnerSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SourcePolicyUpdateRequest"
      responses:
        "200":
          description: Updated policy document with the change impact.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourcePolicyDocument"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/classification/ruleset:
    get:
      operationId: getClassificationRuleSet
      summary: Read the active classification rule set
      description: >-
        Serves the active, versioned classification rule set to collectors and
        shows it to the Owner. Owner sessions read it for management; Device
        Tokens need the rules:read scope. Clients cache the last successful
        version and keep executing it offline, so a rule fetch never blocks
        local classification and raw titles are never sent anywhere to be
        classified.
      tags: [Classification]
      security:
        - OwnerSession: []
        - DeviceToken: []
      x-required-scopes: [rules:read]
      responses:
        "200":
          description: The active rule set document with its version and per-rule versions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassificationRuleSet"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
    put:
      operationId: updateClassificationRuleSet
      summary: Replace the semantic entities and classification rules
      description: >-
        Owner-session-only full replacement of the semantic dictionary and the
        rule set. Every successful update bumps the rule set version; each
        created or changed rule receives its own incremented version so past
        uploads stay explainable against the rule version that produced them.
        Rules must reference entities included in the same request, so the
        published document is always internally consistent. The change is
        audited with the from/to versions and the added, updated, and removed
        rule identifiers. Rule changes affect future observations; they never
        rewrite already uploaded events.
      tags: [Classification]
      security:
        - OwnerSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClassificationRuleSetUpdateRequest"
      responses:
        "200":
          description: The published rule set with server-managed versions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassificationRuleSet"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/classification/reclassification/estimate:
    get:
      operationId: estimateReclassification
      summary: Estimate the scope an explicit reclassification could cover
      description: >-
        Owner-session-only dry run for an explicit historical reclassification
        task. Reports the devices that uploaded in-scope activity, their event
        counts, and the time ranges those events span, so the Owner sees the
        expected impact before starting anything. The scope is finalized,
        non-AFK activity intervals that still sit below the reserved
        manual-correction revision space; invalidated observations and events
        an Owner has manually corrected are never part of it. This is an upper
        bound only: a device can actually re-evaluate an event only while its
        raw local context is still within device retention, and anything
        beyond that is reported as unrecoverable by the task, never silently
        skipped. Nothing is modified by an estimate.
      tags: [Reclassification]
      security:
        - OwnerSession: []
      parameters:
        - name: from
          in: query
          required: false
          description: Inclusive UTC instant bounding the estimated scope.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: Exclusive UTC instant bounding the estimated scope.
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: The estimated devices, event counts, and time ranges.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReclassificationEstimate"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/classification/reclassification/tasks:
    post:
      operationId: createReclassificationTask
      summary: Start an explicit historical reclassification task
      description: >-
        Owner-session-only and always an explicit action: creating the task
        freezes the estimated scope at this moment and tells devices to
        re-evaluate their locally retained raw context against the target rule
        set version. Rule edits alone never change already uploaded events;
        only revisions devices submit while working on a task do. The target
        rule set version defaults to the currently published one and must not
        exceed it. At most one task may be open at a time. The creation is
        audited with the Owner, the target rule version, and the time range.
      tags: [Reclassification]
      security:
        - OwnerSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReclassificationTaskCreateRequest"
      responses:
        "200":
          description: The created open task with its frozen scope estimate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReclassificationTaskStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/classification/reclassification/tasks/current:
    get:
      operationId: getCurrentReclassificationTask
      summary: Read the latest reclassification task with its progress
      description: >-
        Owner-session-only progress view of the latest reclassification task
        (open or closed). Reports the aggregated scanned, reclassified,
        unchanged, failed, and unrecoverable counts plus one entry per
        reporting device; unrecoverable is computed by the server as the
        frozen task scope minus what the device still found locally, so events
        beyond device retention become explicitly visible. Returns no content
        while no task was ever created.
      tags: [Reclassification]
      security:
        - OwnerSession: []
      responses:
        "200":
          description: The latest task with its progress and per-device reports.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReclassificationTaskStatus"
        "204":
          description: No reclassification task exists yet.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/classification/reclassification/tasks/assignment:
    get:
      operationId: getReclassificationTaskAssignment
      summary: Read the reclassification task a device should work on
      description: >-
        Device-token endpoint requiring the rules:read scope (the same
        distribution scope as the rule set, because executing a task means
        re-executing rules locally). Returns the currently open task unless
        this device has already reported it; devices poll it, refresh their
        cached rule set to the target version, re-run their local engine over
        locally retained finalized activity, submit higher revisions through
        the batch endpoint, and report the outcome counts. Returns no content
        when there is no open task or it was already reported.
      tags: [Reclassification]
      security:
        - DeviceToken: []
      x-required-scopes: [rules:read]
      responses:
        "200":
          description: The open task this device should process.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReclassificationTaskAssignment"
        "204":
          description: No open task, or the open task was already reported by this device.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/classification/reclassification/tasks/{task_id}/device-reports:
    post:
      operationId: reportReclassificationTaskProgress
      summary: Report one device's reclassification outcome counts
      description: >-
        Device-token endpoint requiring the rules:read scope. A device submits
        its outcome counts after processing an assigned task: how many
        in-scope events it still found locally (scanned), how many received a
        higher revision (reclassified), how many needed no change (unchanged),
        and how many uploads the server rejected (failed). Reporting the same
        task twice replaces the previous report, so a retried pass converges.
        Events whose raw context aged out of local retention are never claimed
        by a device; the server reports them as unrecoverable. The report is
        audited per device.
      tags: [Reclassification]
      security:
        - DeviceToken: []
      x-required-scopes: [rules:read]
      parameters:
        - $ref: "#/components/parameters/ReclassificationTaskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReclassificationDeviceReportRequest"
      responses:
        "204":
          description: The report was recorded and audited.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/classification/reclassification/tasks/{task_id}/close:
    post:
      operationId: closeReclassificationTask
      summary: Close a reclassification task and audit its actual impact
      description: >-
        Owner-session-only completion of a reclassification task. Closing
        writes the audit record with the Owner, the target rule version, the
        time range, the Owner report timezone, and the actual impact counts
        (scanned, reclassified, unchanged, failed, unrecoverable, and the
        number of reporting devices). Affected derived summaries are rebuilt
        on read, so every view already agrees with the submitted revisions.
        Closing is idempotent.
      tags: [Reclassification]
      security:
        - OwnerSession: []
      parameters:
        - $ref: "#/components/parameters/ReclassificationTaskId"
      responses:
        "200":
          description: The closed task with its final progress statement.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReclassificationTaskStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
components:
  securitySchemes:
    OwnerSession:
      type: apiKey
      in: cookie
      name: liveqs_session
      description: Revocable HttpOnly Owner browser session.
    DeviceToken:
      type: http
      scheme: bearer
      bearerFormat: LiveQs device token
      description: >-
        Independently revocable upload-only collector credential. Plaintext
        tokens start with the recognizable prefix lqdev_ and are shown once at
        creation; the server stores only a SHA-256 digest.
    QueryToken:
      type: http
      scheme: bearer
      bearerFormat: LiveQs query token
      description: >-
        Scoped, expiring, read-only credential for AI and integrations.
        Plaintext tokens start with the recognizable prefix lqqry_ and are
        shown once at creation; the server stores only a SHA-256 digest.
  parameters:
    CredentialId:
      name: credential_id
      in: path
      required: true
      description: Public identifier of the credential, as returned at creation.
      schema:
        type: string
        minLength: 1
    EventId:
      name: event_id
      in: path
      required: true
      description: Stable identifier of the logical event to correct.
      schema:
        type: string
        format: uuid
    ReclassificationTaskId:
      name: task_id
      in: path
      required: true
      description: Identifier of the reclassification task, as returned at creation.
      schema:
        type: string
        format: uuid
    From:
      name: from
      in: query
      required: true
      description: Inclusive UTC instant.
      schema:
        type: string
        format: date-time
    To:
      name: to
      in: query
      required: true
      description: Exclusive UTC instant; must be later than from.
      schema:
        type: string
        format: date-time
    Timezone:
      name: timezone
      in: query
      required: true
      description: IANA timezone used to interpret reporting boundaries.
      schema:
        type: string
        minLength: 1
        example: Asia/Shanghai
    EventType:
      name: event_type
      in: query
      required: false
      schema:
        type: string
        example: activity.interval
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque continuation cursor returned by the preceding page.
      schema:
        type: string
        minLength: 1
    PageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Date:
      name: date
      in: query
      required: true
      description: Local calendar day in the report timezone.
      schema:
        type: string
        format: date
    ReportTimezone:
      name: timezone
      in: query
      required: false
      description: >-
        IANA timezone overriding the Owner report timezone for this request.
      schema:
        type: string
        minLength: 1
        example: Asia/Shanghai
  responses:
    BadRequest:
      description: Request shape or semantics are invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Credential is missing, expired, revoked, or invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Credential lacks the required scope, event type, or privacy ceiling.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: Credential rate limit was exceeded.
      headers:
        Retry-After:
          description: Seconds until another request may be attempted.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: The request conflicts with existing state.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: The referenced resource does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    OwnerStatus:
      title: Owner Status
      type: object
      additionalProperties: false
      required: [initialized]
      properties:
        initialized:
          type: boolean
          description: True once the single implicit Owner password has been created.
    OwnerPasswordRequest:
      title: Owner Password Request
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password:
          type: string
          minLength: 8
          maxLength: 256
          description: The Owner password. Never logged or stored in plaintext.
    OwnerSessionInfo:
      title: Owner Session Info
      type: object
      additionalProperties: false
      required: [authenticated]
      properties:
        authenticated:
          type: boolean
          description: Always true when the endpoint responds 200.
    OwnerSettings:
      title: Owner Settings
      type: object
      additionalProperties: false
      required: [report_timezone]
      properties:
        report_timezone:
          type: string
          minLength: 1
          description: >-
            IANA timezone defining the default day and week boundaries for
            reports. Defaults to UTC until the Owner configures another
            timezone; browser timezones never change a report.
    OwnerSettingsUpdate:
      title: Owner Settings Update
      type: object
      additionalProperties: false
      required: [report_timezone]
      properties:
        report_timezone:
          type: string
          minLength: 1
          description: New report timezone as an IANA timezone name.
    CredentialKind:
      title: Credential Kind
      type: string
      enum: [device_token, query_token]
      description: >-
        Actor type the credential authenticates: a device collector uploads
        events, a query agent reads approved data domains.
    CredentialScope:
      title: Credential Scope
      type: string
      enum: [events:write, events:read, health:write, health:read, payment:write, payment:read, rules:read]
      description: >-
        Capability granted to the credential. Scopes are domain-scoped:
        events:write, health:write, and payment:write restrict which event
        domains a device token may upload (activity intervals, Health Connect
        observations, payment transactions), while events:read, health:read,
        and payment:read restrict which domains a query token may read.
        rules:read lets a device token download the classification rule set so
        it can classify locally; it is device-only, because rule distribution
        is a collector concern and the management plane stays with the Owner
        session. A credential never holds a scope outside its actor type.
    CredentialPrivacyCeiling:
      title: Credential Privacy Ceiling
      type: string
      enum: [normal, sensitive, private]
      description: >-
        Maximum privacy level the credential may touch, ordered normal <
        sensitive < private. Uploads above the ceiling are rejected per item;
        reads exclude data above the ceiling.
    CredentialCreateRequest:
      title: Credential Create Request
      type: object
      additionalProperties: false
      required: [kind, name, scopes]
      properties:
        kind:
          $ref: "#/components/schemas/CredentialKind"
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Owner-chosen label, such as a collector or agent name.
        scopes:
          type: array
          minItems: 1
          maxItems: 8
          uniqueItems: true
          items:
            $ref: "#/components/schemas/CredentialScope"
          description: >-
            Non-empty subset of the actor type's scopes: device tokens may
            hold events:write, health:write, payment:write, and rules:read;
            query tokens may hold events:read, health:read, and payment:read.
        allowed_event_types:
          type: array
          default: []
          uniqueItems: true
          items:
            type: string
            pattern: "^[a-z][a-z0-9]*(\\.[a-z][a-z0-9]*)+$"
          description: >-
            Event types the credential may upload or read. Empty permits every
            registered event type; a non-empty list is an exact allow-list.
        privacy_ceiling:
          $ref: "#/components/schemas/CredentialPrivacyCeiling"
          default: normal
        expires_at:
          type: [string, "null"]
          format: date-time
          default: null
          description: >-
            UTC instant after which the credential is rejected at use; null
            means the credential never expires.
    CredentialView:
      title: Credential View
      type: object
      additionalProperties: false
      required:
        - credential_id
        - kind
        - name
        - token_prefix
        - scopes
        - allowed_event_types
        - privacy_ceiling
        - created_at
        - expires_at
        - last_used_at
        - revoked_at
      properties:
        credential_id:
          type: string
          minLength: 1
          description: Public identifier used to revoke the credential.
        kind:
          $ref: "#/components/schemas/CredentialKind"
        name:
          type: string
        token_prefix:
          type: string
          minLength: 1
          description: >-
            Recognizable prefix of the token plaintext for identification;
            never the full token or its digest.
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/CredentialScope"
        allowed_event_types:
          type: array
          items:
            type: string
        privacy_ceiling:
          $ref: "#/components/schemas/CredentialPrivacyCeiling"
        created_at:
          type: string
          format: date-time
        expires_at:
          type: [string, "null"]
          format: date-time
        last_used_at:
          type: [string, "null"]
          format: date-time
          description: UTC instant of the most recent accepted use; null while unused.
        revoked_at:
          type: [string, "null"]
          format: date-time
    CredentialCreated:
      title: Credential Created
      type: object
      additionalProperties: false
      required: [credential, token]
      properties:
        credential:
          $ref: "#/components/schemas/CredentialView"
        token:
          type: string
          minLength: 1
          description: >-
            Plaintext token shown exactly once. It cannot be recovered from
            the server afterwards.
    CredentialList:
      title: Credential List
      type: object
      additionalProperties: false
      required: [credentials]
      properties:
        credentials:
          type: array
          items:
            $ref: "#/components/schemas/CredentialView"
    HeartbeatRequest:
      title: Heartbeat Request
      type: object
      additionalProperties: false
      required: [platform, captured_at, activity]
      properties:
        platform:
          type: string
          enum: [windows, android]
          description: Collector platform the heartbeat originates from.
        device_name:
          type: string
          maxLength: 100
          description: >-
            Optional human-readable display label of the device. It is display
            metadata only; the server-bound device identity always comes from
            the authenticated Device Token.
        captured_at:
          type: string
          format: date-time
          description: >-
            UTC instant at which the device observed the reported current
            state. Heartbeat ordering, freshness, and expiry are decided from
            this instant, so a heartbeat queued during an outage can never
            pretend to be fresher than the moment it describes.
        activity:
          $ref: "#/components/schemas/HeartbeatActivity"
    HeartbeatActivity:
      title: Heartbeat Activity
      type: object
      additionalProperties: false
      required: [is_afk]
      description: >-
        Minimal structured current-activity context. Unknown fields are
        rejected so raw window titles and executable paths cannot be smuggled
        into the projection.
      properties:
        application_id:
          type: string
          maxLength: 200
          description: >-
            Foreground application identifier such as a package name or
            executable name. Never a full executable path; values containing
            path separators or drive-letter prefixes are rejected.
        application_label:
          type: string
          maxLength: 200
          description: >-
            Short local display label for the application, such as file
            description metadata; never raw window text.
        is_afk:
          type: boolean
          description: Whether the user is currently away from the device.
    DeviceStatus:
      title: Device Status
      type: object
      additionalProperties: false
      required: [device_id, platform, online, age_seconds, captured_at, activity]
      properties:
        device_id:
          type: string
          minLength: 1
          description: >-
            Server-bound device identity: the identifier of the Device Token
            credential that reported the heartbeat, matching the device lane of
            its historical events.
        device_name:
          type: [string, "null"]
          description: Last reported display label, or null when the collector sent none.
        platform:
          type: string
          enum: [windows, android]
        online:
          type: boolean
          description: >-
            True while the latest heartbeat capture time is less than sixty
            seconds old; a device whose heartbeats stop shows offline within
            sixty seconds.
        age_seconds:
          type: integer
          minimum: 0
          description: >-
            Seconds elapsed since the latest heartbeat capture time, clamped at
            zero. While a collector reports at its normal cadence this stays at
            or below thirty.
        captured_at:
          type: string
          format: date-time
          description: UTC instant of the latest accepted heartbeat capture.
        activity:
          $ref: "#/components/schemas/HeartbeatActivity"
    DeviceStatusList:
      title: Device Status List
      type: object
      additionalProperties: false
      required: [server_time, devices]
      properties:
        server_time:
          type: string
          format: date-time
          description: UTC instant at which the ages and online flags were computed.
        devices:
          type: array
          description: One independent entry per device that has reported a heartbeat.
          items:
            $ref: "#/components/schemas/DeviceStatus"
    SyncDiagnosticsReport:
      title: Sync Diagnostics Report
      type: object
      additionalProperties: false
      required: [platform, pending_count, permanent_failure_count, recent_errors]
      description: >-
        Compact synchronization-state snapshot pushed by a collector on its
        sync cadence. Counts, codes, and timestamps only; the bounded `message`
        of an error entry must be a safe summary — never a token, a raw window
        title, an executable path, or notification text.
      properties:
        platform:
          type: string
          enum: [windows, android]
          description: Collector platform the snapshot originates from.
        device_name:
          type: string
          maxLength: 100
          description: >-
            Optional human-readable display label of the device. It is display
            metadata only; the server-bound device identity always comes from
            the authenticated Device Token.
        collected_at:
          type: string
          format: date-time
          description: >-
            UTC capture instant of the most recent local observation the
            collector still holds. Omitted when it has not collected anything
            yet. A fresh value with a zero pending count means the device
            collected and delivered; a fresh value with a growing pending
            count means collection works but delivery lags.
        last_successful_upload_at:
          type: string
          format: date-time
          description: UTC instant of the most recent acknowledged upload, if any.
        oldest_pending_at:
          type: string
          format: date-time
          description: >-
            Capture instant of the oldest observation still waiting in the
            outbox, if any. How long data has been stuck unuploaded.
        pending_count:
          type: integer
          minimum: 0
          description: >-
            Outbox entries awaiting acknowledgement, including entries waiting
            for their next backoff attempt. Permanent failures are counted
            separately.
        permanent_failure_count:
          type: integer
          minimum: 0
          description: >-
            Entries in the local failure queue: permanently rejected events
            that are never retried and stay visible for diagnosis.
        recent_errors:
          type: array
          maxItems: 10
          description: Most recent sync errors, newest first.
          items:
            $ref: "#/components/schemas/SyncDiagnosticError"
    SyncDiagnosticError:
      title: Sync Diagnostic Error
      type: object
      additionalProperties: false
      required: [code, message, occurred_at]
      properties:
        code:
          type: string
          maxLength: 64
          pattern: "^[a-z][a-z0-9_]*$"
          description: >-
            Stable error code: the server's per-item rejection code for
            permanent failures (such as invalid_event or insufficient_scope),
            or a client-side transport code (such as network_error,
            request_timeout, or server_error) for transient failures.
        message:
          type: string
          maxLength: 300
          description: >-
            Safe, bounded human-readable summary. Contract-level server
            validation text is safe to relay; exception text that could embed
            local content must be replaced by a fixed summary for its code.
        occurred_at:
          type: string
          format: date-time
          description: UTC instant at which the error was observed.
    SyncDiagnostic:
      title: Sync Diagnostic
      type: object
      additionalProperties: false
      required: [device_id, platform, reported_at, age_seconds, collected_at, pending_count, permanent_failure_count, recent_errors]
      properties:
        device_id:
          type: string
          minLength: 1
          description: >-
            Server-bound device identity: the identifier of the Device Token
            credential that pushed the snapshot.
        device_name:
          type: [string, "null"]
          description: Last reported display label, or null when the collector sent none.
        platform:
          type: string
          enum: [windows, android]
        reported_at:
          type: string
          format: date-time
          description: Server receive instant of the latest snapshot.
        age_seconds:
          type: integer
          minimum: 0
          description: >-
            Seconds elapsed since the latest snapshot was received. During an
            outage no fresh snapshot can arrive, so this age together with the
            heartbeat online flag distinguishes a stale view from a live one.
        collected_at:
          type: [string, "null"]
        last_successful_upload_at:
          type: [string, "null"]
        oldest_pending_at:
          type: [string, "null"]
        pending_count:
          type: integer
          minimum: 0
        permanent_failure_count:
          type: integer
          minimum: 0
        recent_errors:
          type: array
          items:
            $ref: "#/components/schemas/SyncDiagnosticError"
    SyncDiagnosticList:
      title: Sync Diagnostic List
      type: object
      additionalProperties: false
      required: [server_time, devices]
      properties:
        server_time:
          type: string
          format: date-time
          description: UTC instant at which the ages were computed.
        devices:
          type: array
          description: One independent entry per device that has pushed a snapshot.
          items:
            $ref: "#/components/schemas/SyncDiagnostic"
    Event:
      $ref: "./schemas/event.schema.json"
    EventBatchRequest:
      type: object
      additionalProperties: false
      required: [events]
      properties:
        events:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/Event"
    EventBatchResponse:
      type: object
      additionalProperties: false
      required: [results]
      properties:
        results:
          type: array
          minItems: 1
          description: >-
            Exactly one result for each submitted event, in the same order as
            the request array.
          items:
            $ref: "#/components/schemas/EventAcknowledgement"
    EventAcknowledgement:
      type: object
      additionalProperties: false
      required: [event_id, revision, status]
      properties:
        event_id:
          type: string
          format: uuid
        revision:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [accepted, duplicate, stale_revision, rejected]
        error:
          oneOf:
            - $ref: "#/components/schemas/Error"
            - type: "null"
      allOf:
        - if:
            properties:
              status:
                const: rejected
            required: [status]
          then:
            required: [error]
            properties:
              error:
                $ref: "#/components/schemas/Error"
    EventPage:
      type: object
      additionalProperties: false
      required: [data, page, context]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Event"
        page:
          $ref: "#/components/schemas/PageMetadata"
        context:
          $ref: "#/components/schemas/QueryContext"
    PageMetadata:
      title: Page Metadata
      type: object
      additionalProperties: false
      required: [page_size, next_cursor]
      properties:
        page_size:
          type: integer
          minimum: 0
          maximum: 200
        next_cursor:
          type: [string, "null"]
          description: Opaque cursor, or null when no further page exists.
    QueryContext:
      title: Query Context
      type: object
      additionalProperties: false
      required: [from, to, timezone, provenance, completeness]
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        timezone:
          type: string
        provenance:
          type: array
          items:
            type: string
        completeness:
          type: string
          enum: [complete, partial, unknown]
        source_policy_version:
          type: integer
          minimum: 1
          description: >-
            Version of the source policy that produced this response's
            normalized results. Present on single-domain reads (metrics,
            health, payment); absent for cross-domain event reads where one
            version cannot describe every domain.
        data_state:
          type: string
          enum: [observed, zero, no_data]
          description: >-
            Presence semantics for the queried range, so a report never reads
            as a bare number: observed means in-range observations produced the
            reported values; zero means observations exist but the normalized
            value is explicitly 0; no_data means the range holds no
            observations at all. Partial coverage is reported by completeness
            and competing sources by source_conflicts.
        source_conflicts:
          type: array
          description: >-
            Competing observations the source policy resolved (or, for payment
            candidates, deferred to the Owner). Competing observations stay
            retained and are referenced by their event identifiers.
          items:
            $ref: "#/components/schemas/SourceConflict"
        pending_confirmation_count:
          type: integer
          minimum: 0
          description: >-
            Number of in-range observations flagged pending confirmation and
            awaiting Owner review. Present on payment-domain reads; the
            transaction totals cover every observation including these.
    SourceConflict:
      title: Source Conflict
      type: object
      additionalProperties: false
      required: [metric, policy_version, selected_source, selected_event_ids, competing_sources, competing_event_ids, from, to]
      properties:
        metric:
          type: string
          minLength: 1
          description: >-
            Metric key the conflict belongs to, such as usage.app_minutes,
            health.sleep_minutes, or payment.transaction_totals.
        policy_version:
          type: integer
          minimum: 1
          description: Source policy version that made the selection.
        selected_source:
          type: string
          minLength: 1
          description: >-
            Source the policy selected: a source kind for usage and payment
            metrics, a Health Connect data origin for health metrics.
        selected_event_ids:
          type: array
          description: >-
            Stable identifiers of the selected observations inside the conflict
            window. Normalized results reference these source event
            identifiers.
          items:
            type: string
        competing_sources:
          type: array
          description: Sources with retained observations the policy did not select.
          items:
            type: string
        competing_event_ids:
          type: array
          description: >-
            Stable identifiers of the competing observations. They stay
            retained and individually readable; the policy withholds them from
            the normalized result without deleting anything.
          items:
            type: string
        from:
          type: string
          format: date-time
          description: Start of the conflict window (UTC).
        to:
          type: string
          format: date-time
          description: End of the conflict window (UTC).
    SourcePolicyEntry:
      title: Source Policy Entry
      type: object
      additionalProperties: false
      required: [metric, priority]
      properties:
        metric:
          type: string
          minLength: 1
          description: >-
            Metric key with an explicit priority. Usage and payment metrics
            prioritize source kinds; health metrics prioritize Health Connect
            data origins.
        priority:
          type: array
          description: >-
            Source kinds or data origins from highest to lowest priority. The
            highest-priority source with observations in a conflict window
            wins; an empty list means no explicit preference, with all sources
            ranking deterministically by name. Competing observations are never
            deleted.
          items:
            type: string
    SourcePolicyImpact:
      title: Source Policy Impact
      type: object
      additionalProperties: false
      required: [metric, from_version, to_version, timezone, affected_ranges, result_count]
      properties:
        metric:
          type: string
          minLength: 1
          description: Metric key whose priority changed.
        from_version:
          type: integer
          minimum: 1
        to_version:
          type: integer
          minimum: 1
        timezone:
          type: string
          description: >-
            IANA report timezone the affected ranges resolve in, so the audit
            statement is reproducible.
        affected_ranges:
          type: array
          description: >-
            Report-day ranges whose normalized selection differs between the
            old and new policy. Empty when no stored observation competes
            differently.
          items:
            type: object
            additionalProperties: false
            required: [from, to]
            properties:
              from:
                type: string
                format: date
              to:
                type: string
                format: date
        result_count:
          type: integer
          minimum: 0
          description: Number of normalized day results the change affected.
    SourcePolicyDocument:
      title: Source Policy Document
      type: object
      additionalProperties: false
      required: [version, entries, updated_at]
      properties:
        version:
          type: integer
          minimum: 1
          description: >-
            Monotonic policy version. Version 1 with the documented default
            priorities applies until the Owner changes the policy.
        entries:
          type: array
          items:
            $ref: "#/components/schemas/SourcePolicyEntry"
        updated_at:
          type: [string, "null"]
          format: date-time
          description: When this version was written; null for the untouched default.
        impact:
          type: array
          description: >-
            Set on update responses: for each changed metric, the report-day
            ranges and normalized result count the change affected. The same
            statement is appended to the audit log.
          items:
            $ref: "#/components/schemas/SourcePolicyImpact"
    SourcePolicyUpdateRequest:
      title: Source Policy Update Request
      type: object
      additionalProperties: false
      required: [entries]
      properties:
        entries:
          type: array
          description: >-
            Full replacement of the policy entries. Omitted metrics keep the
            default priority; a policy change only rebuilds derived results and
            never modifies raw observations.
          items:
            $ref: "#/components/schemas/SourcePolicyEntry"
    SemanticEntityKind:
      title: Semantic Entity Kind
      type: string
      enum: [service, project]
      description: >-
        Service entities name a cross-platform service (a browser session and
        a native package can both map to one service subject); project
        entities name an Owner-approved project alias used to separate work
        time, for example per-project IDE activity.
    SemanticEntity:
      title: Semantic Entity
      type: object
      additionalProperties: false
      required: [entity_id, kind, name]
      properties:
        entity_id:
          type: string
          minLength: 1
          maxLength: 100
          pattern: "^[a-z][a-z0-9._-]*$"
          description: >-
            Owner-chosen stable subject identifier uploaded in event payloads,
            such as svc.bilibili or project.liveqs. Renaming the display label
            never changes this identifier, so history stays comparable.
        kind:
          $ref: "#/components/schemas/SemanticEntityKind"
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: >-
            Owner-approved display label, such as 哔哩哔哩 or LiveQs. This is the
            only project name that ever exists on the service side; unapproved
            names stay on the collecting device.
    ClassificationRuleKind:
      title: Classification Rule Kind
      type: string
      enum: [application, title_keyword, title_regex]
      description: >-
        application matches the executable or package name exactly (the
        comparison is case-insensitive for Windows executables and exact for
        Android package names); title_keyword matches when the local window
        title contains the keyword case-insensitively; title_regex matches the
        local window title against a regular expression, which is the only way
        to extract a candidate project name.
    ClassificationRulePlatform:
      title: Classification Rule Platform
      type: string
      enum: [windows, android, any]
      description: >-
        Collector platform the rule applies to; any applies everywhere. Title
        rules are only executable on platforms that observe window titles.
    ClassificationRuleInput:
      title: Classification Rule Input
      type: object
      additionalProperties: false
      required: [rule_id, kind, pattern]
      properties:
        rule_id:
          type: string
          minLength: 1
          maxLength: 100
          pattern: "^[a-z][a-z0-9._-]*$"
          description: >-
            Owner-chosen stable rule identifier cited by uploaded
            classifications, such as edge.bilibili.title.
        platform:
          $ref: "#/components/schemas/ClassificationRulePlatform"
        kind:
          $ref: "#/components/schemas/ClassificationRuleKind"
        pattern:
          type: string
          minLength: 1
          maxLength: 300
          description: >-
            The application or package name for application rules, the keyword
            for title_keyword rules, or the regular expression source for
            title_regex rules. It is a matching expression defined by the
            Owner, never device raw text.
        priority:
          type: integer
          minimum: -100000
          maximum: 100000
          description: >-
            Rule precedence: when several rules match, the highest priority
            wins, and equal priorities resolve deterministically by ascending
            rule_id. Defaults to 0.
        confidence:
          type: number
          minimum: 0
          maximum: 1
          description: >-
            Confidence echoed in uploaded classifications. Defaults to 1 for
            application rules, 0.9 for title_regex, and 0.8 for title_keyword.
        subject_entity_id:
          type: string
          minLength: 1
          description: >-
            Entity a match is mapped to. Exactly one of subject_entity_id and
            dynamic must be set, and the entity must exist in the same update.
        dynamic:
          type: boolean
          description: >-
            Dynamic project discovery: the rule is a title_regex with at least
            one capture group, and capture group 1 names a candidate project.
            The device reports such projects as opaque identifiers derived with
            a device-secret HMAC until the Owner approves an alias; the raw
            name never leaves the device. Exactly one of subject_entity_id and
            dynamic must be set.
    ClassificationRule:
      title: Classification Rule
      type: object
      additionalProperties: false
      required: [rule_id, platform, kind, pattern, priority, confidence, version, updated_at]
      properties:
        rule_id:
          type: string
          minLength: 1
        platform:
          $ref: "#/components/schemas/ClassificationRulePlatform"
        kind:
          $ref: "#/components/schemas/ClassificationRuleKind"
        pattern:
          type: string
          minLength: 1
        priority:
          type: integer
        confidence:
          type: number
          minimum: 0
          maximum: 1
        subject_entity_id:
          type: [string, "null"]
          description: Target entity identifier, or null for dynamic discovery rules.
        dynamic:
          type: boolean
          description: True for dynamic project discovery rules.
        version:
          type: integer
          minimum: 1
          description: >-
            Server-managed per-rule version, incremented every time the rule
            is created or changed so uploaded classifications stay explainable
            against the exact rule that produced them.
        updated_at:
          type: [string, "null"]
          format: date-time
          description: When this rule version was published; null only inside an update request.
    ClassificationRuleSet:
      title: Classification Rule Set
      type: object
      additionalProperties: false
      required: [rule_set_version, entities, rules]
      properties:
        rule_set_version:
          type: integer
          minimum: 0
          description: >-
            Distribution version of the whole document. Version 0 with empty
            entities and rules applies until the Owner publishes the first
            rule set; every Owner update increments it by one, so devices can
            tell whether their cached copy is current.
        updated_at:
          type: [string, "null"]
          format: date-time
          description: When this version was published; null for the untouched default.
        entities:
          type: array
          description: Owner-approved semantic subjects. Unapproved project names never appear here.
          items:
            $ref: "#/components/schemas/SemanticEntity"
        rules:
          type: array
          description: Versioned rules devices execute locally, ordered by descending priority.
          items:
            $ref: "#/components/schemas/ClassificationRule"
    ClassificationRuleSetUpdateRequest:
      title: Classification Rule Set Update Request
      type: object
      additionalProperties: false
      required: [entities, rules]
      properties:
        entities:
          type: array
          description: Full replacement of the semantic dictionary.
          items:
            $ref: "#/components/schemas/SemanticEntity"
        rules:
          type: array
          description: >-
            Full replacement of the rule set. Every rule must reference an
            entity in the same request; server-managed versions are assigned
            by the response, so input rules carry no version fields.
          items:
            $ref: "#/components/schemas/ClassificationRuleInput"
    CorrectionField:
      title: Correction Field
      type: object
      additionalProperties: false
      required: [path, value]
      properties:
        path:
          type: string
          minLength: 1
          maxLength: 100
          pattern: "^[a-zA-Z][a-zA-Z0-9_.]*$"
          description: >-
            Dotted path of one contract-approved structured field, such as
            payload.amount.value, payload.category, payload.pending_confirmation,
            or start_at. The correctable set is governed per registered event
            type by the payload registry; identity, source, device, provenance,
            and free text are never correctable.
        value:
          description: >-
            Replacement value for the field. Types are validated against the
            event's registered schema; an invalid merged payload is rejected.
    EventCorrectionRequest:
      title: Event Correction Request
      type: object
      additionalProperties: false
      properties:
        fields:
          type: array
          description: >-
            Structured field corrections to apply. Omitted or empty is allowed
            only when the request changes the invalidation state.
          items:
            $ref: "#/components/schemas/CorrectionField"
        reason:
          type: [string, "null"]
          maxLength: 500
          description: >-
            Optional Owner-provided reason recorded in the audit trail; never
            device raw text.
        invalidate:
          type: boolean
          default: false
          description: >-
            Marks the observation invalid (a false positive) so it leaves
            default timeline views and statistics while staying retained and
            auditable. Omitted keeps the current validity; a request that
            neither changes fields nor the invalidation state is rejected.
    CorrectionImpact:
      title: Correction Impact
      type: object
      additionalProperties: false
      required: [metric, timezone, affected_ranges, result_count]
      properties:
        metric:
          type: string
          minLength: 1
          description: >-
            Metric key whose derived results the correction touches, such as
            usage.app_minutes or payment.transaction_totals.
        timezone:
          type: string
          description: IANA report timezone the affected ranges resolve in.
        affected_ranges:
          type: array
          description: Report-day ranges whose derived summaries rebuild on the next read.
          items:
            type: object
            additionalProperties: false
            required: [from, to]
            properties:
              from:
                type: string
                format: date
              to:
                type: string
                format: date
        result_count:
          type: integer
          minimum: 0
          description: Number of normalized day results the correction affects.
    EventCorrectionResult:
      title: Event Correction Result
      type: object
      additionalProperties: false
      required: [event, changed_fields, reason, invalidated, corrected_at, revision, impact]
      properties:
        event:
          $ref: "#/components/schemas/Event"
        changed_fields:
          type: array
          description: Dotted paths of the fields this correction changed.
          items:
            type: string
        reason:
          type: [string, "null"]
          description: The recorded reason, or null when the correction carried none.
        invalidated:
          type: boolean
          description: Validity of the latest revision after this correction.
        corrected_at:
          type: string
          format: date-time
          description: UTC instant at which the correction was applied.
        revision:
          type: integer
          minimum: 1
          description: Revision allocated by this correction in the reserved manual-correction space.
        impact:
          type: array
          description: Per affected metric, the report-day ranges and result count that rebuild.
          items:
            $ref: "#/components/schemas/CorrectionImpact"
    ReclassificationEstimateDevice:
      title: Reclassification Estimate Device
      type: object
      additionalProperties: false
      required: [device_id, platform, event_count, earliest_start_at, latest_start_at]
      properties:
        device_id:
          type: string
          minLength: 1
          description: Server-bound device identity the in-scope events were uploaded with.
        platform:
          type: string
          enum: [windows, android]
          description: Collector platform the device reported its events with.
        event_count:
          type: integer
          minimum: 1
          description: >-
            In-scope events uploaded by this device: finalized, non-AFK
            activity intervals below the reserved manual-correction revision
            space. This is the frozen upper bound a task holds this device
            accountable for; events beyond the device's local retention show
            up as unrecoverable instead of being reclassified.
        earliest_start_at:
          type: [string, "null"]
          format: date-time
          description: Earliest observed start of this device's in-scope events.
        latest_start_at:
          type: [string, "null"]
          format: date-time
          description: Latest observed start of this device's in-scope events.
    ReclassificationEstimate:
      title: Reclassification Estimate
      type: object
      additionalProperties: false
      required: [generated_at, total_events, devices]
      properties:
        generated_at:
          type: string
          format: date-time
          description: Instant the estimate was computed; a task freezes its own estimate at creation.
        total_events:
          type: integer
          minimum: 0
          description: In-scope events across all devices.
        devices:
          type: array
          description: One entry per device holding in-scope events, ordered by device identity.
          items:
            $ref: "#/components/schemas/ReclassificationEstimateDevice"
    ReclassificationTaskCreateRequest:
      title: Reclassification Task Create Request
      type: object
      additionalProperties: false
      properties:
        target_rule_set_version:
          type: integer
          minimum: 1
          description: >-
            Rule set version devices must hold before re-evaluating. Defaults
            to the currently published rule set version; a version above the
            published one is rejected because no device could ever fetch it.
        from:
          type: string
          format: date-time
          description: Optional inclusive UTC instant bounding the task scope.
        to:
          type: string
          format: date-time
          description: Optional exclusive UTC instant bounding the task scope; must be later than from.
    ReclassificationDeviceReportRequest:
      title: Reclassification Device Report Request
      type: object
      additionalProperties: false
      required: [platform, scanned, reclassified, unchanged, failed]
      properties:
        platform:
          type: string
          enum: [windows, android]
        scanned:
          type: integer
          minimum: 0
          description: In-scope events the device still found locally and re-evaluated.
        reclassified:
          type: integer
          minimum: 0
          description: Events for which a higher revision was accepted (or already stored).
        unchanged:
          type: integer
          minimum: 0
          description: >-
            Events whose locally re-computed interpretation already matched, including events a
            manual Owner correction or a newer revision protects (stale_revision is a yield, not
            a failure).
        failed:
          type: integer
          minimum: 0
          description: Events whose uploads were permanently rejected.
    ReclassificationTaskAssignment:
      title: Reclassification Task Assignment
      type: object
      additionalProperties: false
      required: [task_id, target_rule_set_version, from, to]
      properties:
        task_id:
          type: string
          format: uuid
        target_rule_set_version:
          type: integer
          minimum: 1
          description: >-
            Rule set version the device must cache before re-evaluating; a
            device that cannot fetch this version defers the task instead of
            working with stale rules.
        from:
          type: [string, "null"]
          format: date-time
          description: Inclusive UTC instant bounding the task scope; null means unbounded.
        to:
          type: [string, "null"]
          format: date-time
          description: Exclusive UTC instant bounding the task scope; null means unbounded.
    ReclassificationDeviceReport:
      title: Reclassification Device Report
      type: object
      additionalProperties: false
      required: [device_id, platform, scanned, reclassified, unchanged, failed, unrecoverable, reported_at]
      properties:
        device_id:
          type: string
          minLength: 1
          description: Server-bound device identity that reported.
        platform:
          type: string
          enum: [windows, android]
        scanned:
          type: integer
          minimum: 0
        reclassified:
          type: integer
          minimum: 0
        unchanged:
          type: integer
          minimum: 0
        failed:
          type: integer
          minimum: 0
        unrecoverable:
          type: integer
          minimum: 0
          description: >-
            Server-computed events of the frozen task scope this device did not find locally:
            the raw context aged out of device retention. Never silently skipped.
        reported_at:
          type: string
          format: date-time
    ReclassificationTaskProgress:
      title: Reclassification Task Progress
      type: object
      additionalProperties: false
      required: [devices_reported, scanned, reclassified, unchanged, failed, unrecoverable]
      properties:
        devices_reported:
          type: integer
          minimum: 0
        scanned:
          type: integer
          minimum: 0
        reclassified:
          type: integer
          minimum: 0
        unchanged:
          type: integer
          minimum: 0
        failed:
          type: integer
          minimum: 0
        unrecoverable:
          type: integer
          minimum: 0
          description: Sum of the per-device unrecoverable counts.
    ReclassificationTaskStatus:
      title: Reclassification Task Status
      type: object
      additionalProperties: false
      required: [task_id, status, target_rule_set_version, from, to, created_at, closed_at, estimate, progress, device_reports]
      properties:
        task_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [open, closed]
        target_rule_set_version:
          type: integer
          minimum: 1
        from:
          type: [string, "null"]
          format: date-time
        to:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
        closed_at:
          type: [string, "null"]
          format: date-time
        estimate:
          $ref: "#/components/schemas/ReclassificationEstimate"
        progress:
          $ref: "#/components/schemas/ReclassificationTaskProgress"
        device_reports:
          type: array
          description: One entry per reporting device, ordered by device identity.
          items:
            $ref: "#/components/schemas/ReclassificationDeviceReport"
    UsageMetrics:
      title: Usage Metrics
      type: object
      additionalProperties: false
      required: [device_minutes, active_minutes]
      properties:
        device_minutes:
          type: integer
          minimum: 0
          description: >-
            Device minutes: the sum of qualifying device intervals overlapping
            the report range across all devices, including AFK foreground time.
            Concurrent device use can exceed elapsed wall-clock time.
        active_minutes:
          type: integer
          minimum: 0
          description: >-
            Active minutes: the union of qualifying non-AFK intervals over the
            report range. Overlapping or adjacent device time counts once.
    UsageDeviceMetrics:
      title: Usage Device Metrics
      type: object
      additionalProperties: false
      required: [device_id, platform, device_minutes, active_minutes]
      properties:
        device_id:
          type: string
          minLength: 1
          description: Device lane identifier as reported in the event envelope.
        platform:
          type: string
          enum: [windows, android]
        device_minutes:
          type: integer
          minimum: 0
          description: Device minutes attributed to this device lane.
        active_minutes:
          type: integer
          minimum: 0
          description: >-
            Deduplicated non-AFK time of this device lane; lane unions do not
            de-duplicate across devices.
    UsageDayMetrics:
      title: Usage Day Metrics
      type: object
      additionalProperties: false
      required: [date, device_minutes, active_minutes]
      properties:
        date:
          type: string
          format: date
          description: Local calendar day in the report timezone.
        device_minutes:
          type: integer
          minimum: 0
        active_minutes:
          type: integer
          minimum: 0
    UsageDayReport:
      title: Usage Day Report
      type: object
      additionalProperties: false
      required: [date, timezone, metrics, devices, context]
      properties:
        date:
          type: string
          format: date
          description: The requested local calendar day.
        timezone:
          type: string
          description: IANA timezone the day boundaries resolved in.
        metrics:
          $ref: "#/components/schemas/UsageMetrics"
        devices:
          type: array
          description: One entry per device lane contributing intervals to the day.
          items:
            $ref: "#/components/schemas/UsageDeviceMetrics"
        context:
          $ref: "#/components/schemas/QueryContext"
    UsageWeekReport:
      title: Usage Week Report
      type: object
      additionalProperties: false
      required: [week_start_date, week_end_date, timezone, metrics, days, context]
      properties:
        week_start_date:
          type: string
          format: date
          description: First local day of the Monday-start week in the report timezone.
        week_end_date:
          type: string
          format: date
          description: Last local day of the Monday-start week in the report timezone.
        timezone:
          type: string
          description: IANA timezone the week boundaries resolved in.
        metrics:
          $ref: "#/components/schemas/UsageMetrics"
        days:
          type: array
          description: One entry per local day of the week, in order.
          items:
            $ref: "#/components/schemas/UsageDayMetrics"
        context:
          $ref: "#/components/schemas/QueryContext"
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error, request_id]
      properties:
        error:
          $ref: "#/components/schemas/Error"
        request_id:
          type: string
          minLength: 1
    Error:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          pattern: "^[a-z][a-z0-9_]*$"
        message:
          type: string
          minLength: 1
        details:
          type: object
          additionalProperties: true
