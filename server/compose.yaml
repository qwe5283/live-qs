services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build: .
    restart: unless-stopped
    ports:
      - "8787:8787"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      MONGODB_URI: mongodb://mongo:27017/live_qs_smoke
      # Comma-separated allow-list; must cover every origin the WebUI is served from.
      CORS_ORIGINS: "http://localhost:5173,http://localhost:8080,http://192.168.1.3:8080"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/api/v1/owner/status"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  web:
    build: ../web
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - server
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  mongo-data:
